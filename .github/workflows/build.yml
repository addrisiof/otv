name: Compila APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Estrai il progetto dallo zip
        run: unzip -q -o OrbitaTV-progetto.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accetta le licenze dell'SDK Android già installato
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Compila
        working-directory: orbita-tv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Allega l'APK alla run
        uses: actions/upload-artifact@v4
        with:
          name: OrbitaTV-apk
          path: orbita-tv/app/build/outputs/apk/release/*.apk

      - name: Pubblica come release "latest" (link diretto per Downloader)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp orbita-tv/app/build/outputs/apk/release/app-release.apk OrbitaTV.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OrbitaTV.apk --title "Orbita TV – ultima build" --notes "Build automatica dal commit ${GITHUB_SHA::7}"
